name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install ruff==0.8.6
      - run: ruff check --select E9,F63,F7,F82 sagedral_ml tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpcap-dev build-essential libgomp1 nftables
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Test with coverage
        run: pytest tests/ -v --tb=short --cov=sagedral_ml --cov-report=xml --cov-report=term-missing
      - name: Detection performance smoke test
        if: matrix.python-version == '3.8'
        run: python scripts/benchmark.py --iterations 1000 --minimum-fps 1000
      - name: Labeled PCAP precision/recall regression
        if: matrix.python-version == '3.8'
        run: python scripts/pcap_regression.py --self-test --minimum-precision 0.70 --minimum-recall 0.85
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.8'
        with:
          name: python-3.8-coverage
          path: coverage.xml

  performance-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpcap-dev build-essential libgomp1
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install py-spy==0.4.0
      - name: Profile detection hot loop
        run: py-spy record --nonblocking --format speedscope --output detection-profile.json -- python scripts/benchmark.py --iterations 10000 --minimum-fps 1000
      - uses: actions/upload-artifact@v4
        with:
          name: detection-performance-profile
          path: detection-profile.json

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: sagedral_ml/dashboard/package-lock.json
      - working-directory: sagedral_ml/dashboard
        run: npm ci
      - working-directory: sagedral_ml/dashboard
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install bandit==1.7.10
      - run: bandit -r sagedral_ml -lll -x sagedral_ml/database/migrations
