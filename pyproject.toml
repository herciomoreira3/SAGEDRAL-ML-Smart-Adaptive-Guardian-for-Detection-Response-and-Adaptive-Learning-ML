[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagedral-ml"
version = "1.0.0"
description = "Smart Adaptive Guardian for Enhanced Detection, Response, and Adaptive Learning - ML NIDPS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["nids", "nidps", "intrusion-detection", "machine-learning", "network-security", "ips"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

dependencies = [
    "scapy>=2.5.0",
    "lightgbm>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "click>=8.1.0",
    "tomli-w>=1.0.0",
    "scikit-learn>=1.3.0",
    "dpkt>=1.9.8",
    "psutil>=5.9.0",
    "joblib>=1.3.0",
    "requests>=2.28.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
]
train = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
]

[project.scripts]
sagedral-ml = "sagedral_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sagedral_ml"]
artifacts = ["sagedral_ml/static/**"]
