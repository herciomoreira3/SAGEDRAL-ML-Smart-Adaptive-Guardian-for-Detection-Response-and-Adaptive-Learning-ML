[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagedral-ml"
version = "1.0.0"
description = "Smart Adaptive Guardian for Enhanced Detection, Response, and Adaptive Learning - ML NIDPS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["nids", "nidps", "intrusion-detection", "machine-learning", "network-security", "ips"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

dependencies = [
    "scapy>=2.5.0",
    "lightgbm>=3.3.0,<4.0",
    "numpy>=1.21.0,<1.25",
    "pandas>=1.3.0,<2.1",
    "fastapi>=0.100.0,<0.110",
    "uvicorn[standard]>=0.23.0,<0.30",
    "sqlalchemy[asyncio]>=2.0.0,<2.1",
    "aiosqlite>=0.19.0",
    "click>=8.1.0",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "scikit-learn>=1.0.0,<1.4",
    "dpkt>=1.9.8",
    "psutil>=5.9.0",
    "joblib>=1.2.0",
    "requests>=2.28.0",
    "websockets>=11.0,<13",
    "typing_extensions>=4.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.2",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.9",
    "limits>=3.0.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
]
train = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
]

[project.scripts]
sagedral-ml = "sagedral_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sagedral_ml"]
artifacts = ["sagedral_ml/static/**"]
